<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d — multiple elements</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #444;
        font-family: monospace;
        font-size: 13px;
        line-height: 24px;
        overscroll-behavior: none;
      }
      a {
        color: #08f;
      }
      #content {
        position: absolute;
        top: 0;
        width: 100%;
        z-index: 1;
        padding: 3em 0 0;
      }
      #info {
        position: absolute;
        top: 0;
        width: 100%;
        padding: 10px;
        text-align: center;
        pointer-events: none;
      }
      #info a {
        pointer-events: auto;
      }
      #c {
        position: absolute;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .list-item {
        display: inline-block;
        margin: 1em;
        padding: 1em;
        box-shadow: 1px 2px 4px 0 rgba(0, 0, 0, 0.25);
      }
      .list-item > div:first-child {
        width: 200px;
        height: 200px;
      }
      .list-item > div:nth-child(2) {
        color: #888;
        font-family: sans-serif;
        font-size: large;
        width: 200px;
        margin-top: 0.5em;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="content">
      <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - multiple elements - webgl
      </div>
    </div>
    <script type="module" src="./webgl_multiple_elements.ts"></script>
  </body>
</html>
