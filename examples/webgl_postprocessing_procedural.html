<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ek3d — procedural effects</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      #wrapper {
        position: absolute;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    <script id="procedural-vert" type="x-shader/x-vertex">
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    </script>
    <script id="noiseRandom1D-frag" type="x-shader/x-fragment">
      #include <common>

      varying vec2 vUv;

      void main() {
        gl_FragColor.xyz = vec3( rand( vUv ) );
        gl_FragColor.w = 1.0;
      }
    </script>
    <script id="noiseRandom2D-frag" type="x-shader/x-fragment">
      #include <common>

      varying vec2 vUv;

      void main() {
        vec2 rand2 = vec2( rand( vUv ), rand( vUv + vec2( 0.4, 0.6 ) ) );
        gl_FragColor.xyz = mix( mix( vec3( 1.0, 1.0, 1.0 ), vec3( 0.0, 0.0, 1.0 ), rand2.x ), vec3( 0.0 ), rand2.y );
        gl_FragColor.w = 1.0;
      }
    </script>
    <script id="noiseRandom3D-frag" type="x-shader/x-fragment">
      #include <common>

      varying vec2 vUv;

      void main() {
        vec3 rand3 = vec3( rand( vUv ), rand( vUv + vec2( 0.4, 0.6 ) ), rand( vUv + vec2( 0.6, 0.4 ) ) );
        gl_FragColor.xyz = rand3;
        gl_FragColor.w = 1.0;
      }
    </script>
  </head>
  <body>
    <div id="wrapper"><canvas id="scene"></canvas></div>
    <script type="module" src="./webgl_postprocessing_procedural.ts"></script>
  </body>
</html>
