<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d — canvas texture</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        pointer-events: none;
        font: 13px sans-serif;
      }
      #info a {
        color: #8af;
        pointer-events: auto;
      }
      #drawing-canvas {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 2;
        cursor: crosshair;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - webgl - canvas as a texture
      <div>click and draw in the white box</div>
    </div>
    <canvas id="drawing-canvas" height="128" width="128" aria-label="Drawing canvas"></canvas>
    <script type="module" src="./webgl_materials_texture_canvas.ts"></script>
  </body>
</html>
