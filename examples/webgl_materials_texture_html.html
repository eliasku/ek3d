<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ek3d — HTML texture</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #aaaaaa;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        font-family: sans-serif;
        color: #000;
      }
      #wrapper {
        position: absolute;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #draw_element {
        width: 600px;
        background-color: #aaaaaa;
        color: #000000;
        font-family: sans-serif;
        font-size: 30px;
        line-height: 1.5;
        text-align: center;
        padding: 30px;
      }
      #draw_element img {
        animation: swing 1s ease-in-out infinite alternate;
      }
      #draw_element input[type="text"] {
        font-size: 24px;
        padding: 8px 12px;
        border: 2px solid #888;
        border-radius: 6px;
        width: 80%;
        margin-top: 10px;
      }
      #draw_element button {
        font-size: 24px;
        padding: 8px 20px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        background-color: #4caf50;
        color: white;
        cursor: pointer;
      }
      #draw_element button:hover {
        background-color: #2196f3;
      }
      @keyframes swing {
        from {
          transform: rotate(-15deg);
        }
        to {
          transform: rotate(15deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="info">ek3d - webgl - HTMLTexture</div>
    <div id="wrapper"><canvas id="scene"></canvas></div>
    <script type="module" src="./webgl_materials_texture_html.ts"></script>
  </body>
</html>
