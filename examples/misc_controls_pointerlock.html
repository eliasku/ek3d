<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>ek3d — pointer lock controls</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #ffffff;
      }
      #wrapper {
        position: absolute;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #blocker {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-color: rgba(0, 0, 0, 0.5);
      }
      #instructions {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
        cursor: pointer;
      }
      #blocker[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <p>Click to control the camera with the pointer lock.</p>
        <p>WASD or arrow keys to move, Space to jump.</p>
      </div>
    </div>
    <div id="wrapper"><canvas id="scene"></canvas></div>
    <script type="module" src="./misc_controls_pointerlock.ts"></script>
  </body>
</html>
