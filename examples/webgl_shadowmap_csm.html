<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d — cascaded shadow maps</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #wrapper,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        font: 13px sans-serif;
        pointer-events: none;
      }
      #info a {
        color: white;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <canvas id="scene"></canvas>
      <div id="info">
        Cascaded shadow maps by <a href="https://github.com/strandedkitty/three-csm">StrandedKitty</a>
      </div>
    </div>
    <script type="module" src="./webgl_shadowmap_csm.ts"></script>
  </body>
</html>
