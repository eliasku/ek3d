<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offscreen canvas worker</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #container {
        position: absolute;
        inset: 0 0 55px;
        display: flex;
      }
      canvas {
        width: 50%;
        height: 100%;
      }
      #controls {
        position: absolute;
        bottom: 10px;
        width: 100%;
        text-align: center;
      }
      #button {
        display: inline-block;
        padding: 4px 6px;
        background: #ddd;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="container"><canvas id="onscreen"></canvas><canvas id="offscreen"></canvas></div>
    <div id="controls">
      <div id="button">START JANK</div>
      <div id="result"></div>
    </div>
    <script type="module" src="./webgl_worker_offscreencanvas.ts"></script>
  </body>
</html>
