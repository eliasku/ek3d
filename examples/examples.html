<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d — demo browser</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #152238;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
      }
      #browser {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #sidebar {
        width: 260px;
        min-width: 260px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
      }
      #browser-controls .lil-gui {
        width: 100%;
      }
      #demo-search {
        margin: 8px;
        padding: 6px 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
        font-size: 13px;
      }
      #demo-list {
        overflow-y: auto;
        flex: 1;
        padding: 0 8px 12px;
      }
      #demo-list h3 {
        margin: 10px 2px 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.65;
      }
      .demo-item {
        display: block;
        width: 100%;
        text-align: left;
        margin: 1px 0;
        padding: 5px 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .demo-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .demo-item.active {
        background: rgba(90, 160, 255, 0.25);
      }
      #demo-holder {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      #demo-frame {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        border: 0;
        transform: translate(-50%, -50%);
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div id="browser">
      <div id="sidebar">
        <div id="browser-controls"></div>
        <input id="demo-search" type="search" placeholder="filter demos…" />
        <div id="demo-list"></div>
      </div>
      <div id="demo-holder"><iframe id="demo-frame" title="rendered demo"></iframe></div>
    </div>
    <canvas id="browser-check-target" hidden></canvas>
    <script type="module" src="./examples.ts"></script>
  </body>
</html>
