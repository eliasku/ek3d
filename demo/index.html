<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d · integrated scene</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #152238;
      }
      #example {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #scene {
        touch-action: none;
      }
      #overlay {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="example">
      <canvas id="scene"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
