<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ek3d · Three.js in TypeScript</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --polymer: #c9cbc4;
        --graphite: #252824;
        --oxide: #565b52;
        --ral-2004: #e25303;
        --cobalt: #1959ed;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--polymer);
        color: var(--graphite);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--ral-2004);
        color: var(--graphite);
      }
      #scene {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100svh;
        opacity: 0;
        transition: opacity 600ms;
      }
      #scene[data-state="rendered"] {
        opacity: 1;
      }
      #landing {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100svh;
        padding: 32px clamp(24px, 5.8vw, 100px) 48px;
        pointer-events: none;
      }
      .topline {
        display: flex;
        align-items: center;
      }
      .brand {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -2px;
      }
      a {
        pointer-events: auto;
        color: inherit;
        text-decoration: none;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }
      .copy {
        align-self: center;
        width: 50%;
        padding: 64px 0;
      }
      .title {
        margin-bottom: 32px;
        font-size: clamp(54px, 6.4vw, 104px);
        font-weight: 700;
        line-height: 0.98;
        letter-spacing: -0.065em;
      }
      .description {
        max-width: 400px;
        color: var(--oxide);
        font-size: 16px;
        line-height: 1.65;
      }
      .description div + div {
        margin-top: 16px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 0 20px;
        font-size: 14px;
        font-weight: 700;
        transition: transform 180ms;
      }
      .cta:hover {
        transform: translateY(-2px);
      }
      .cta svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }
      .examples-link {
        background: var(--cobalt);
        color: #fff;
      }
      .examples-link svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      .github-link {
        background: var(--ral-2004);
        color: var(--graphite);
      }
      @media (max-width: 760px) {
        #landing {
          padding: 22px 24px 32px;
        }
        .brand {
          font-size: 32px;
        }
        .copy {
          width: 100%;
          margin-top: max(280px, 40svh);
          padding: 0;
        }
        .title {
          margin-bottom: 24px;
          font-size: clamp(52px, 12vw, 82px);
        }
        .description {
          max-width: 440px;
          font-size: 15px;
        }
        .actions {
          margin-top: 26px;
          gap: 8px;
        }
        .cta {
          gap: 8px;
          padding: 0 12px;
          font-size: 13px;
        }
        .cta svg {
          width: 18px;
          height: 18px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="landing">
      <div class="topline">
        <div class="brand">ek3d</div>
      </div>
      <div class="copy">
        <div class="title">Three.js.<br />TypeScript.</div>
        <div class="description">
          <div>An open-source fork of Three.js in TypeScript.</div>
          <div>Focused on WebGL. No XR, AR or WebGPU.</div>
          <div>Direct module imports. No barrel re-exports or global THREE namespace.</div>
        </div>
        <div class="actions">
          <a class="cta examples-link" href="/examples/examples.html">
            <svg viewBox="0 0 24 24"><path d="M5 19 19 5M5 5h14v14" /></svg>
            Examples
          </a>
          <a class="cta github-link" href="https://github.com/eliasku/ek3d" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 .75a11.25 11.25 0 0 0-3.558 21.923c.563.104.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.79-1.51-3.79-1.51-.512-1.3-1.25-1.647-1.25-1.647-1.022-.699.078-.685.078-.685 1.13.08 1.725 1.16 1.725 1.16 1.005 1.723 2.637 1.225 3.28.937.102-.729.393-1.225.715-1.507-2.5-.284-5.13-1.25-5.13-5.563 0-1.228.44-2.232 1.16-3.019-.117-.285-.503-1.428.11-2.976 0 0 .945-.303 3.094 1.154a10.79 10.79 0 0 1 5.625 0c2.147-1.457 3.09-1.154 3.09-1.154.615 1.548.23 2.69.113 2.976.722.787 1.158 1.79 1.158 3.019 0 4.324-2.634 5.276-5.144 5.555.405.35.767 1.04.767 2.097 0 1.514-.014 2.735-.014 3.106 0 .3.203.65.774.54A11.251 11.251 0 0 0 12 .75Z"
              />
            </svg>
            Star on GitHub
          </a>
        </div>
      </div>
    </div>
    <script type="module" src="/examples/landing.ts"></script>
  </body>
</html>
